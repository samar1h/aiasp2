<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIASP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
window.onerror = function(msg, src, line, col, err) {
  showFatalError(msg, err && err.stack ? err.stack : (src + ':' + line + ':' + col));
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  showFatalError(e.reason && e.reason.message ? e.reason.message : 'Unhandled promise rejection', e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
});
function showFatalError(message, detail) {
  var existing = document.getElementById('fatal-error-banner');
  if (existing) return;
  var banner = document.createElement('div');
  banner.id = 'fatal-error-banner';
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#3a1a12;color:#ffe4d6;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;font-size:13px;padding:12px 14px;border-top:2px solid #d97757;box-shadow:0 -2px 12px rgba(0,0,0,0.3);';
  var text = document.createElement('div');
  text.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:10px;';
  var msgSpan = document.createElement('span');
  msgSpan.textContent = 'Something went wrong: ' + message;
  msgSpan.style.cssText = 'flex:1;';
  var toggle = document.createElement('button');
  toggle.textContent = 'Details';
  toggle.style.cssText = 'background:rgba(255,255,255,0.12);color:#ffe4d6;border:1px solid rgba(255,255,255,0.25);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;flex-shrink:0;';
  var closeBtn = document.createElement('button');
  closeBtn.textContent = '✕';
  closeBtn.style.cssText = 'background:transparent;color:#ffe4d6;border:none;font-size:16px;cursor:pointer;flex-shrink:0;padding:0 4px;';
  text.appendChild(msgSpan);
  text.appendChild(toggle);
  text.appendChild(closeBtn);
  var details = document.createElement('pre');
  details.textContent = detail || 'No further details available.';
  details.style.cssText = 'display:none;margin:10px 0 0;white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,0.25);padding:8px;border-radius:6px;max-height:160px;overflow:auto;font-family:monospace;font-size:11px;';
  toggle.onclick = function() { details.style.display = details.style.display === 'none' ? 'block' : 'none'; };
  closeBtn.onclick = function() { banner.remove(); };
  banner.appendChild(text);
  banner.appendChild(details);
  document.body.appendChild(banner);
}
</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
:root {
  --bg: #FAF8F4;
  --bg-elevated: #FFFFFF;
  --ink: #241E1A;
  --ink-soft: #6B6259;
  --ink-faint: #A39A8F;
  --line: #E8E1D6;
  --accent: #C9622D;
  --accent-soft: #F2DED0;
  --accent-ink: #FFFFFF;
  --error: #B3432B;
  --error-bg: #FBEAE3;
  --shadow: 0 1px 2px rgba(36,30,26,0.04), 0 4px 16px rgba(36,30,26,0.05);
  --radius: 14px;
  --radius-sm: 9px;
}
html[data-theme="dark"] {
  --bg: #1A1613;
  --bg-elevated: #221D19;
  --ink: #F2ECE3;
  --ink-soft: #B0A69A;
  --ink-faint: #736A60;
  --line: #342C25;
  --accent: #E08A57;
  --accent-soft: #3A281D;
  --accent-ink: #1A1613;
  --error: #E39684;
  --error-bg: #3A211B;
  --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 4px 20px rgba(0,0,0,0.3);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scrollbar-gutter: stable; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  transition: background 0.25s ease, color 0.25s ease;
  min-height: 100vh;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }

.search-sticky-top { padding-top: 28px; }

.search-sticky {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg);
  padding-top: 16px;
  padding-bottom: 12px;
  transition: background 0.25s ease;
}
.search-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.search-box { position: relative; display: flex; align-items: center; flex: 1; min-width: 0; }
.filter-toggle-btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--bg-elevated);
  color: var(--ink-soft);
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease;
}
.filter-toggle-btn svg { width: 17px; height: 17px; }
.filter-toggle-btn.active { border-color: var(--accent); color: var(--accent); }

.options-panel { display: none; }
.options-panel.is-visible { display: block; }
.filter-toggle-btn .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.search-box svg { position: absolute; left: 14px; width: 17px; height: 17px; color: var(--ink-faint); pointer-events: none; }
.search-box input {
  width: 100%;
  padding: 12px 14px 12px 40px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--bg-elevated);
  color: var(--ink);
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.search-box input::placeholder { color: var(--ink-faint); }
.search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.chips-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 0 4px;
  scrollbar-width: none;
}
.chips-row::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
  padding: 7px 13px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-elevated);
  color: var(--ink-soft);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
}
.chip:active { transform: scale(0.96); }
.chip.active {
  background: var(--accent) !important;
  border-color: var(--accent) !important;
  color: var(--accent-ink) !important;
  font-weight: 500;
}
.chip:focus-visible, .icon-btn:focus-visible, input:focus-visible, .card:focus-visible, .sort-btn:focus-visible, .action-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.data-issue-banner {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  margin-bottom: 10px;
  padding: 12px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--error);
  background: var(--error-bg);
  color: var(--error);
  font-size: 12.5px;
  font-family: 'JetBrains Mono', monospace;
  cursor: pointer;
  text-align: left;
  box-shadow: var(--shadow);
  transition: opacity 0.15s ease;
}
.data-issue-banner:hover { opacity: 0.85; }
.data-issue-banner svg { width: 15px; height: 15px; flex-shrink: 0; }
.data-issue-banner span.chev { margin-left: auto; opacity: 0.7; }

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0 16px;
  gap: 10px;
  flex-wrap: wrap;
  height: 26px;
}
.result-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  color: var(--ink-faint);
  line-height: 26px;
}
.toolbar-controls { display: flex; align-items: center; gap: 6px; height: 26px; }
.sort-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  flex-shrink: 0;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--bg-elevated);
  color: var(--ink);
  cursor: pointer;
  transition: border-color 0.15s ease;
}
.theme-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  flex-shrink: 0;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--bg-elevated);
  color: var(--ink-soft);
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
}
.theme-btn:active { transform: scale(0.92); }
.theme-btn svg { width: 13px; height: 13px; }
.sort-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

.card-list { display: flex; flex-direction: column; gap: 10px; }
.card {
  display: flex;
  gap: 13px;
  padding: 15px;
  border-radius: var(--radius);
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  animation: rise 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.12s ease;
  cursor: pointer;
}
.card:active { transform: scale(0.988); }
.card:hover { border-color: var(--accent); }
.card.is-open { border-color: var(--ink-faint); box-shadow: 0 2px 4px rgba(36,30,26,0.06), 0 8px 24px rgba(36,30,26,0.07); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.card-icon {
  flex-shrink: 0;
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: var(--tone-bg, var(--accent-soft));
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.card.is-open .card-icon { transform: scale(1.06); }
.card-icon svg { width: 21px; height: 21px; color: var(--tone-fg, var(--accent)); stroke: currentColor; }
.card-icon img { width: 100%; height: 100%; object-fit: cover; }
.card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.card-top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.card-title {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 17px;
  margin: 0;
  line-height: 1.3;
}
.card-title .missing {
  background: var(--error-bg);
  color: var(--error);
  padding: 1px 7px;
  border-radius: 5px;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 13.5px;
  display: inline-block;
}
.card-chevron {
  flex-shrink: 0;
  color: var(--ink-faint);
  width: 16px;
  height: 16px;
  margin-top: 3px;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), color 0.15s ease;
}
.card-chevron svg { width: 100%; height: 100%; }
.card.is-open .card-chevron { transform: rotate(180deg); color: var(--ink-soft); }
.card-desc {
  font-size: 13.5px;
  color: var(--ink-soft);
  margin: 4px 0 0;
  line-height: 1.45;
}
.clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.more-toggle {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 12.5px;
  font-weight: 600;
  font-family: inherit;
  padding: 0;
  margin: 0;
  cursor: pointer;
  display: inline;
}
.card-expand {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}
.card.is-open .card-expand { grid-template-rows: 1fr; }
.card-expand-inner { overflow: hidden; }
.card-keywords { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.card-keyword {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 4px 9px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
}
.card-date { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-faint); margin-top: 10px; }
.card-actions { display: flex; gap: 8px; margin-top: 12px; }
.action-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 500;
  font-family: 'JetBrains Mono', monospace;
  cursor: pointer;
  text-decoration: none;
  border: 1px solid var(--line);
  background: var(--bg-elevated);
  color: var(--ink);
  position: relative;
  transition: border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
}
.action-btn:hover { border-color: var(--accent); color: var(--accent); }
.action-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
.action-btn.is-disabled { opacity: 0.45; cursor: default; }
.action-btn.is-disabled:hover { border-color: var(--line); color: var(--ink); }
.action-tooltip {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 0;
  background: var(--ink);
  color: var(--bg);
  font-size: 11px;
  padding: 5px 9px;
  border-radius: 6px;
  white-space: nowrap;
  z-index: 5;
}

.state-block { text-align: center; padding: 56px 20px; color: var(--ink-soft); }
.state-block svg { width: 30px; height: 30px; color: var(--ink-faint); margin-bottom: 10px; }
.state-block p { font-size: 14px; margin: 0; }
.state-block.error { color: var(--error); }
.state-block.error svg { color: var(--error); }
.error-panel {
  background: var(--error-bg);
  border-radius: var(--radius);
  padding: 20px;
  text-align: left;
  margin-top: 16px;
}
.error-panel summary { cursor: pointer; font-size: 12.5px; color: var(--error); font-family: 'JetBrains Mono', monospace; margin-top: 10px; }
.error-panel pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; background: rgba(0,0,0,0.05); padding: 10px; border-radius: 8px; margin-top: 8px; }

.skeleton { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.skel-card { height: 74px; border-radius: var(--radius); background: linear-gradient(90deg, var(--bg-elevated) 25%, var(--line) 50%, var(--bg-elevated) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(20,15,10,0.45);
  display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg-elevated);
  border-radius: var(--radius);
  padding: 22px;
  max-width: 380px;
  width: 100%;
  box-shadow: var(--shadow);
}
.modal h2 { font-family: 'Fraunces', serif; font-size: 17px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.modal h2 svg { width: 17px; height: 17px; color: var(--error); flex-shrink: 0; }
.modal .modal-sub { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 14px; }
.modal ul { margin: 0 0 16px; padding-left: 18px; font-size: 13px; color: var(--ink-soft); max-height: 180px; overflow-y: auto; }
.modal li { margin-bottom: 6px; word-break: break-all; overflow-wrap: break-word; }
.modal button { width: 100%; padding: 10px; border-radius: var(--radius-sm); border: none; background: var(--accent); color: var(--accent-ink); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }

.tone-0 { --tone-bg: #F2DED0; --tone-fg: #C9622D; }
.tone-1 { --tone-bg: #DCE8DC; --tone-fg: #4C7A52; }
.tone-2 { --tone-bg: #DCE3EF; --tone-fg: #4A6B9E; }
.tone-3 { --tone-bg: #EDE0F0; --tone-fg: #8A5A9E; }
.tone-4 { --tone-bg: #F0E4D0; --tone-fg: #A47D2E; }
html[data-theme="dark"] .tone-0 { --tone-bg: #3A281D; --tone-fg: #E08A57; }
html[data-theme="dark"] .tone-1 { --tone-bg: #253A28; --tone-fg: #82B389; }
html[data-theme="dark"] .tone-2 { --tone-bg: #24304A; --tone-fg: #8FAEDE; }
html[data-theme="dark"] .tone-3 { --tone-bg: #362A3E; --tone-fg: #C79BDA; }
html[data-theme="dark"] .tone-4 { --tone-bg: #3A2F1A; --tone-fg: #D9B860; }

::selection { background: var(--accent-soft); color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="search-sticky search-sticky-top">
    <div class="search-row">
      <div class="search-box">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="text" placeholder="Search projects…" autocomplete="off">
      </div>
      <button id="options-toggle-btn" class="filter-toggle-btn" aria-label="Show filters" title="Filters"></button>
    </div>
    <div id="options-panel" class="options-panel">
      <div id="chips-row" class="chips-row" style="display:none;"></div>
    </div>
    <div class="toolbar">
      <span id="result-count" class="result-count">—</span>
      <div class="toolbar-controls">
        <button id="theme-btn" class="theme-btn"></button>
        <button id="sort-btn" class="sort-btn"></button>
      </div>
    </div>
  </div>

  <div id="content-area"></div>
</div>

<div id="modal-root"></div>

<script>
(function() {
  var state = {
    projects: [],
    filtered: [],
    search: '',
    activeChips: new Set(),
    sortMode: 0,
    loadState: 'loading',
    errorDetail: '',
    expandedDescriptions: new Set(),
    openCards: new Set(),
    dataIssues: { missingTitles: [], malformed: [] }
  };

  var SORT_MODES = [
    { key: 'default', label: 'Default', icon: 'shuffle' },
    { key: 'alpha-asc', label: 'A–Z', icon: 'arrow-down-a-z' },
    { key: 'alpha-desc', label: 'Z–A', icon: 'arrow-up-a-z' },
    { key: 'date-new', label: 'Newest', icon: 'calendar-arrow-down' },
    { key: 'date-old', label: 'Oldest', icon: 'calendar-arrow-up' }
  ];

  var contentArea = document.getElementById('content-area');
  var searchInput = document.getElementById('search-input');
  var chipsRow = document.getElementById('chips-row');
  var resultCount = document.getElementById('result-count');
  var sortBtn = document.getElementById('sort-btn');
  var themeBtn = document.getElementById('theme-btn');

  function toPascal(kebab) {
    return kebab.split('-').map(function(s) { return s.charAt(0).toUpperCase() + s.slice(1); }).join('');
  }

  function iconExists(name) {
    try {
      if (!window.lucide || !lucide.icons) return true;
      var camel = name.replace(/-([a-z0-9])/g, function(_, c) { return c.toUpperCase(); });
      camel = camel.charAt(0).toUpperCase() + camel.slice(1);
      return !!(lucide.icons[toPascal(name)] || lucide.icons[name] || lucide.icons[camel]);
    } catch (e) { return true; }
  }

  function makeIcon(name) {
    var i = document.createElement('i');
    i.setAttribute('data-lucide', name);
    i.style.cssText = 'display:inline-block;width:1em;height:1em;';
    return i;
  }

  function refreshIcons() {
    try {
      if (window.lucide && typeof lucide.createIcons === 'function') {
        lucide.createIcons();
      }
    } catch (e) {}
    healBrokenIcons();
  }

  function healBrokenIcons() {
    document.querySelectorAll('i[data-lucide]').forEach(function(el) {
      if (!el.querySelector('svg')) {
        var fallback = el.getAttribute('data-lucide') === 'sun' || el.getAttribute('data-lucide') === 'moon' ? 'circle' : 'box';
        el.setAttribute('data-lucide', fallback);
        try {
          if (window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons();
        } catch (e) {}
      }
    });
  }

  function initTheme() {
    var stored = null;
    try { stored = localStorage.getItem('theme'); } catch (e) {}
    var theme = stored === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    renderThemeBtn();
  }

  function renderThemeBtn() {
    var theme = document.documentElement.getAttribute('data-theme');
    themeBtn.innerHTML = '';
    themeBtn.appendChild(makeIcon(theme === 'dark' ? 'moon' : 'sun'));
    themeBtn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
    themeBtn.title = theme === 'dark' ? 'Dark' : 'Light';
    refreshIcons();
  }

  themeBtn.addEventListener('click', function() {
    var current = document.documentElement.getAttribute('data-theme');
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    renderThemeBtn();
  });

  function normalizeField(val) {
    if (val === undefined || val === null) return null;
    if (typeof val === 'string' && val.trim() === '') return null;
    if (Array.isArray(val) && val.length === 0) return null;
    return val;
  }

  function safeNormalizeProject(raw, index) {
    try {
      if (typeof raw !== 'object' || raw === null || Array.isArray(raw)) {
        return { _malformed: true, _index: index };
      }
      var title = normalizeField(raw.title);
      var description = normalizeField(raw.description);
      var keywords = normalizeField(raw.keywords);
      if (keywords && !Array.isArray(keywords)) keywords = null;
      var icon = normalizeField(raw.icon);
      var favicon = normalizeField(raw.favicon);
      var url = normalizeField(raw.url);
      var sourceUrl = normalizeField(raw.source_url);
      var added = normalizeField(raw.added);
      return {
        title: typeof title === 'string' ? title : null,
        description: typeof description === 'string' ? description : null,
        keywords: keywords ? keywords.filter(function(k) { return typeof k === 'string' && k.trim(); }) : [],
        icon: typeof icon === 'string' ? icon : null,
        favicon: typeof favicon === 'string' ? favicon : null,
        url: typeof url === 'string' ? url : null,
        source_url: typeof sourceUrl === 'string' ? sourceUrl : null,
        added: typeof added === 'string' ? added : null,
        _malformed: false,
        _index: index
      };
    } catch (e) {
      return { _malformed: true, _index: index };
    }
  }

  async function loadProjects() {
    try {
      var res = await fetch('projects.json');
      if (!res.ok) {
        throw new Error('Request failed with status ' + res.status + ' ' + res.statusText);
      }
      var text = await res.text();
      var data;
      try {
        data = JSON.parse(text);
      } catch (parseErr) {
        throw new Error('Response was not valid JSON: ' + parseErr.message);
      }
      if (!Array.isArray(data)) {
        throw new Error('Expected a JSON array, got ' + typeof data);
      }
      state.projects = data.map(safeNormalizeProject);
      state.loadState = 'loaded';
      checkDataIssues();
      buildChips();
      applyFilters();
      render();
    } catch (err) {
      state.loadState = 'error';
      state.errorDetail = (err && err.stack) ? err.stack : String(err);
      state.errorMessage = err && err.message ? err.message : String(err);
      render();
    }
  }

  function checkDataIssues() {
    var missingTitles = state.projects.filter(function(p) { return !p._malformed && !p.title; });
    var malformed = state.projects.filter(function(p) { return p._malformed; });
    state.dataIssues = { missingTitles: missingTitles, malformed: malformed };
  }

  function buildDataIssueBanner() {
    var issues = state.dataIssues || { missingTitles: [], malformed: [] };
    var total = issues.missingTitles.length + issues.malformed.length;
    if (total === 0) return null;
    var banner = document.createElement('button');
    banner.type = 'button';
    banner.className = 'data-issue-banner';
    banner.appendChild(makeIcon('triangle-alert'));
    var label = document.createElement('span');
    label.textContent = total === 1 ? '1 project has a data issue' : total + ' projects have data issues';
    banner.appendChild(label);
    var chev = document.createElement('span');
    chev.className = 'chev';
    chev.textContent = 'Details →';
    banner.appendChild(chev);
    banner.addEventListener('click', openDataIssuesModal);
    return banner;
  }

  function openDataIssuesModal() {
    var issues = state.dataIssues || { missingTitles: [], malformed: [] };
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
    var modal = document.createElement('div');
    modal.className = 'modal';

    var h2 = document.createElement('h2');
    h2.appendChild(makeIcon('triangle-alert'));
    var titleSpan = document.createElement('span');
    var total = issues.missingTitles.length + issues.malformed.length;
    titleSpan.textContent = total === 1 ? '1 data issue found' : total + ' data issues found';
    h2.appendChild(titleSpan);
    modal.appendChild(h2);

    if (issues.missingTitles.length) {
      var sub1 = document.createElement('p');
      sub1.className = 'modal-sub';
      sub1.textContent = issues.missingTitles.length === 1 ? 'Missing title:' : 'Missing titles:';
      modal.appendChild(sub1);
      var ul1 = document.createElement('ul');
      issues.missingTitles.forEach(function(p) {
        var li = document.createElement('li');
        li.textContent = p.source_url || p.url || ('entry #' + (p._index + 1));
        ul1.appendChild(li);
      });
      modal.appendChild(ul1);
    }

    if (issues.malformed.length) {
      var sub2 = document.createElement('p');
      sub2.className = 'modal-sub';
      sub2.textContent = issues.malformed.length === 1 ? 'Malformed entry (skipped):' : 'Malformed entries (skipped):';
      modal.appendChild(sub2);
      var ul2 = document.createElement('ul');
      issues.malformed.forEach(function(p) {
        var li = document.createElement('li');
        li.textContent = 'entry #' + (p._index + 1);
        ul2.appendChild(li);
      });
      modal.appendChild(ul2);
    }

    var btn = document.createElement('button');
    btn.textContent = 'Close';
    btn.onclick = function() { overlay.remove(); };
    modal.appendChild(btn);
    overlay.appendChild(modal);
    document.getElementById('modal-root').appendChild(overlay);
    refreshIcons();
  }


  var filterToggleBtn = document.getElementById('options-toggle-btn');
  var filterPanel = document.getElementById('options-panel');
  var filtersVisible = false;
  var hasKeywords = false;

  function buildChips() {
    var allKeywords = new Set();
    state.projects.forEach(function(p) {
      if (!p._malformed) p.keywords.forEach(function(k) { allKeywords.add(k); });
    });
    hasKeywords = allKeywords.size > 0;
    chipsRow.style.display = hasKeywords ? 'flex' : 'none';
    chipsRow.innerHTML = '';
    Array.from(allKeywords).sort(function(a, b) { return a.localeCompare(b); }).forEach(function(kw) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.textContent = kw;
      chip.dataset.keyword = kw;
      chip.addEventListener('click', function() {
        if (state.activeChips.has(kw)) {
          state.activeChips.delete(kw);
          chip.classList.remove('active');
        } else {
          state.activeChips.add(kw);
          chip.classList.add('active');
        }
        applyFilters();
        renderList();
        renderFilterToggleBtn();
      });
      chipsRow.appendChild(chip);
    });
    renderFilterToggleBtn();
  }

  function renderFilterToggleBtn() {
    filterToggleBtn.innerHTML = '';
    filterToggleBtn.appendChild(makeIcon('list-filter'));
    filterToggleBtn.classList.toggle('active', state.activeChips.size > 0 || filtersVisible);
    if (state.activeChips.size > 0) {
      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = state.activeChips.size;
      filterToggleBtn.appendChild(badge);
    }
    filterToggleBtn.setAttribute('aria-label', filtersVisible ? 'Hide filters' : 'Show filters');
    filterToggleBtn.title = filtersVisible ? 'Hide filters' : 'Show filters';
    refreshIcons();
  }

  filterToggleBtn.addEventListener('click', function() {
    filtersVisible = !filtersVisible;
    filterPanel.classList.toggle('is-visible', filtersVisible);
    if (hasKeywords) chipsRow.style.display = 'flex';
    renderFilterToggleBtn();
  });

  function applyFilters() {
    var q = state.search.trim().toLowerCase();
    var list = state.projects.filter(function(p) { return !p._malformed; });
    if (q) {
      list = list.filter(function(p) {
        var t = (p.title || '').toLowerCase();
        var d = (p.description || '').toLowerCase();
        return t.indexOf(q) !== -1 || d.indexOf(q) !== -1;
      });
    }
    if (state.activeChips.size > 0) {
      list = list.filter(function(p) {
        for (var kw of state.activeChips) {
          if (p.keywords.indexOf(kw) === -1) return false;
        }
        return true;
      });
    }
    var mode = SORT_MODES[state.sortMode].key;
    if (mode === 'alpha-asc' || mode === 'alpha-desc') {
      var dir = mode === 'alpha-asc' ? 1 : -1;
      list = list.slice().sort(function(a, b) {
        if (!a.title && b.title) return 1;
        if (a.title && !b.title) return -1;
        if (!a.title && !b.title) return 0;
        return a.title.toLowerCase().localeCompare(b.title.toLowerCase()) * dir;
      });
    } else if (mode === 'date-new' || mode === 'date-old') {
      var ddir = mode === 'date-new' ? -1 : 1;
      list = list.slice().sort(function(a, b) {
        if (!a.added && !b.added) return 0;
        if (!a.added) return 1;
        if (!b.added) return -1;
        return (new Date(a.added) - new Date(b.added)) * ddir;
      });
    }
    state.filtered = list;
  }

  function renderSortBtn() {
    var mode = SORT_MODES[state.sortMode];
    sortBtn.innerHTML = '';
    sortBtn.appendChild(makeIcon(mode.icon));
    sortBtn.setAttribute('aria-label', 'Sort: ' + mode.label);
    sortBtn.title = 'Sort: ' + mode.label;
    refreshIcons();
  }

  sortBtn.addEventListener('click', function() {
    state.sortMode = (state.sortMode + 1) % SORT_MODES.length;
    renderSortBtn();
    applyFilters();
    renderList();
  });

  var searchDebounce;
  searchInput.addEventListener('input', function(e) {
    clearTimeout(searchDebounce);
    var val = e.target.value;
    searchDebounce = setTimeout(function() {
      state.search = val;
      applyFilters();
      renderList();
    }, 150);
  });

  function renderCardIcon(p, idx) {
    var wrap = document.createElement('div');
    wrap.className = 'card-icon tone-' + (idx % 5);
    if (p.icon && iconExists(p.icon)) {
      wrap.appendChild(makeIcon(p.icon));
    } else if (p.favicon) {
      var img = document.createElement('img');
      img.src = p.favicon;
      img.alt = '';
      img.onerror = function() {
        wrap.innerHTML = '';
        wrap.appendChild(makeIcon('box'));
        refreshIcons();
      };
      wrap.appendChild(img);
    } else {
      wrap.appendChild(makeIcon('box'));
    }
    return wrap;
  }

  function formatDate(iso) {
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    } catch (e) { return null; }
  }

  function buildCard(p, idx) {
    try {
      var el = document.createElement('div');
      el.className = 'card';
      el.style.animationDelay = (idx * 25) + 'ms';
      var cardKey = 'c' + p._index;
      if (state.openCards.has(cardKey)) el.classList.add('is-open');

      el.appendChild(renderCardIcon(p, idx));

      var body = document.createElement('div');
      body.className = 'card-body';

      var topRow = document.createElement('div');
      topRow.className = 'card-top-row';

      var titleEl = document.createElement('h3');
      titleEl.className = 'card-title';
      if (p.title) {
        titleEl.textContent = p.title;
      } else {
        var span = document.createElement('span');
        span.className = 'missing';
        span.textContent = 'Missing title';
        titleEl.appendChild(span);
      }
      topRow.appendChild(titleEl);

      var chevron = document.createElement('span');
      chevron.className = 'card-chevron';
      chevron.appendChild(makeIcon('chevron-down'));
      topRow.appendChild(chevron);
      body.appendChild(topRow);

      if (p.description) {
        var descKey = 'd' + p._index;
        var descEl = document.createElement('p');
        descEl.className = 'card-desc clamp-2';
        var descText = document.createElement('span');
        descText.textContent = p.description;
        descEl.appendChild(descText);
        body.appendChild(descEl);

        requestAnimationFrame(function() {
          if (descEl.scrollHeight > descEl.clientHeight + 2 || state.expandedDescriptions.has(descKey)) {
            var toggle = document.createElement('button');
            toggle.type = 'button';
            toggle.className = 'more-toggle';
            var expanded = state.expandedDescriptions.has(descKey);
            toggle.textContent = expanded ? ' less' : ' more';
            if (expanded) descEl.classList.remove('clamp-2');
            toggle.addEventListener('click', function(e) {
              e.stopPropagation();
              var isExpanded = state.expandedDescriptions.has(descKey);
              if (isExpanded) {
                state.expandedDescriptions.delete(descKey);
                descEl.classList.add('clamp-2');
                toggle.textContent = ' more';
              } else {
                state.expandedDescriptions.add(descKey);
                descEl.classList.remove('clamp-2');
                toggle.textContent = ' less';
              }
            });
            descEl.appendChild(toggle);
          }
        });
      }

      var expandWrap = document.createElement('div');
      expandWrap.className = 'card-expand';
      var expandInner = document.createElement('div');
      expandInner.className = 'card-expand-inner';

      if (p.keywords && p.keywords.length) {
        var kwWrap = document.createElement('div');
        kwWrap.className = 'card-keywords';
        p.keywords.forEach(function(kw) {
          var tag = document.createElement('span');
          tag.className = 'card-keyword';
          tag.textContent = kw;
          kwWrap.appendChild(tag);
        });
        expandInner.appendChild(kwWrap);
      }

      var dateStr = p.added ? formatDate(p.added) : null;
      if (dateStr) {
        var dateEl = document.createElement('span');
        dateEl.className = 'card-date';
        dateEl.textContent = dateStr;
        expandInner.appendChild(dateEl);
      }

      var actions = document.createElement('div');
      actions.className = 'card-actions';

      if (p.url) {
        var visitBtn = document.createElement('a');
        visitBtn.className = 'action-btn';
        visitBtn.href = p.url;
        visitBtn.target = '_blank';
        visitBtn.rel = 'noopener noreferrer';
        visitBtn.addEventListener('click', function(e) { e.stopPropagation(); });
        visitBtn.appendChild(makeIcon('external-link'));
        var visitLabel = document.createElement('span');
        visitLabel.textContent = 'Visit';
        visitBtn.appendChild(visitLabel);
        actions.appendChild(visitBtn);
      }

      var srcBtn;
      if (p.source_url) {
        srcBtn = document.createElement('a');
        srcBtn.className = 'action-btn';
        srcBtn.href = p.source_url;
        srcBtn.target = '_blank';
        srcBtn.rel = 'noopener noreferrer';
      } else {
        srcBtn = document.createElement('button');
        srcBtn.type = 'button';
        srcBtn.className = 'action-btn is-disabled';
        srcBtn.setAttribute('aria-disabled', 'true');
        srcBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          var existing = srcBtn.querySelector('.action-tooltip');
          if (existing) { existing.remove(); return; }
          var tip = document.createElement('span');
          tip.className = 'action-tooltip';
          tip.textContent = 'No source URL available';
          srcBtn.appendChild(tip);
          setTimeout(function() { if (tip.parentNode) tip.remove(); }, 2200);
        });
      }
      srcBtn.addEventListener('click', function(e) { e.stopPropagation(); });
      srcBtn.appendChild(makeIcon('code'));
      var srcLabel = document.createElement('span');
      srcLabel.textContent = 'Source';
      srcBtn.appendChild(srcLabel);
      actions.appendChild(srcBtn);

      expandInner.appendChild(actions);
      expandWrap.appendChild(expandInner);
      body.appendChild(expandWrap);
      el.appendChild(body);

      el.addEventListener('click', function() {
        if (state.openCards.has(cardKey)) {
          state.openCards.delete(cardKey);
          el.classList.remove('is-open');
        } else {
          state.openCards.add(cardKey);
          el.classList.add('is-open');
        }
        refreshIcons();
      });

      return el;
    } catch (e) {
      return null;
    }
  }

  function renderList() {
    resultCount.textContent = state.filtered.length + ' of ' + state.projects.filter(function(p) { return !p._malformed; }).length;

    contentArea.innerHTML = '';

    var banner = buildDataIssueBanner();
    if (banner) contentArea.appendChild(banner);

    if (state.projects.filter(function(p) { return !p._malformed; }).length === 0) {
      var empty = document.createElement('div');
      empty.className = 'state-block';
      empty.appendChild(makeIcon('inbox'));
      var ep = document.createElement('p');
      ep.textContent = 'No projects yet — check back soon.';
      empty.appendChild(ep);
      contentArea.appendChild(empty);
      refreshIcons();
      return;
    }

    if (state.filtered.length === 0) {
      var noRes = document.createElement('div');
      noRes.className = 'state-block';
      noRes.appendChild(makeIcon('search-x'));
      var np = document.createElement('p');
      np.textContent = 'No matches — try a different search or filter.';
      noRes.appendChild(np);
      contentArea.appendChild(noRes);
      refreshIcons();
      return;
    }

    var list = document.createElement('div');
    list.className = 'card-list';
    state.filtered.forEach(function(p, idx) {
      var card = buildCard(p, idx);
      if (card) list.appendChild(card);
    });
    contentArea.appendChild(list);
    refreshIcons();
  }

  function render() {
    if (state.loadState === 'loading') {
      contentArea.innerHTML = '';
      var skel = document.createElement('div');
      skel.className = 'skeleton';
      for (var i = 0; i < 4; i++) {
        var s = document.createElement('div');
        s.className = 'skel-card';
        skel.appendChild(s);
      }
      contentArea.appendChild(skel);
      resultCount.textContent = '—';
      return;
    }

    if (state.loadState === 'error') {
      contentArea.innerHTML = '';
      var block = document.createElement('div');
      block.className = 'state-block error';
      block.appendChild(makeIcon('cloud-off'));
      var p1 = document.createElement('p');
      p1.textContent = "Couldn't load the project list.";
      block.appendChild(p1);
      var panel = document.createElement('div');
      panel.className = 'error-panel';
      var msg = document.createElement('p');
      msg.style.margin = '0';
      msg.style.fontSize = '13px';
      msg.textContent = state.errorMessage || 'Unknown error';
      panel.appendChild(msg);
      var details = document.createElement('details');
      var summary = document.createElement('summary');
      summary.textContent = 'Technical details';
      var pre = document.createElement('pre');
      pre.textContent = state.errorDetail || 'No further details.';
      details.appendChild(summary);
      details.appendChild(pre);
      panel.appendChild(details);
      block.appendChild(panel);
      contentArea.appendChild(block);
      resultCount.textContent = '—';
      refreshIcons();
      return;
    }

    renderList();
  }

  initTheme();
  renderSortBtn();
  render();
  loadProjects();
})();
</script>
</body>
</html>
